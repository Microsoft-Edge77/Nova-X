<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Nova X AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: #050505;
      color: #fff;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    .sidebar {
      width: 260px;
      background: #0b0b0b;
      border-right: 1px solid #1a1a1a;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .logo {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .btn {
      background: #111;
      color: #fff;
      border: 1px solid #222;
      padding: 8px 10px;
      font-size: 13px;
      cursor: pointer;
      text-align: left;
      border-radius: 1px;
    }
    .btn.primary {
      background: #0078d4;
      border-color: #0078d4;
    }
    .conversations {
      flex: 1;
      overflow-y: auto;
      margin-top: 8px;
      border-top: 1px solid #1a1a1a;
      padding-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 13px;
    }
    .conv-item {
      padding: 6px 8px;
      background: #111;
      border-radius: 1px;
      border: 1px solid #222;
      cursor: pointer;
    }
    .conv-item.active {
      border-color: #0078d4;
      background: #0f1720;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #050505;
    }
    .header {
      padding: 10px 14px;
      border-bottom: 1px solid #1a1a1a;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .header-title {
      font-size: 16px;
      font-weight: 600;
    }
    .header-sub {
      font-size: 12px;
      color: #888;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg-row {
      display: flex;
      width: 100%;
    }
    .msg-row.user {
      justify-content: flex-end;
    }
    .msg-row.nova {
      justify-content: flex-start;
    }
    .msg {
      max-width: 70%;
      padding: 8px 10px;
      font-size: 13px;
      line-height: 1.4;
      border-radius: 1px;
      border: 1px solid #222;
      background: #111;
      opacity: 0;
      transform: translateY(4px);
      animation: fadeInUp 0.18s ease-out forwards;
    }
    .msg.user {
      background: #0078d4;
      border-color: #0078d4;
    }
    .msg.nova {
      background: #151515;
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .input-bar {
      border-top: 1px solid #1a1a1a;
      padding: 8px 10px;
      display: flex;
      gap: 6px;
      align-items: center;
      background: #050505;
    }
    .input-bar input[type="text"] {
      flex: 1;
      background: #111;
      border: 1px solid #222;
      color: #fff;
      padding: 8px 10px;
      font-size: 13px;
      border-radius: 1px;
      outline: none;
    }
    .input-bar input[type="file"] {
      display: none;
    }
    .icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 1px;
      border: 1px solid #222;
      background: #111;
      color: #fff;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .icon-btn.primary {
      background: #0078d4;
      border-color: #0078d4;
    }
    .image-bubble {
      margin-top: 4px;
      border-radius: 1px;
      border: 1px solid #222;
      overflow: hidden;
      background: #050505;
    }
    .image-bubble img {
      display: block;
      width: 100%;
      height: auto;
    }
    .image-actions {
      padding: 6px 8px;
      display: flex;
      justify-content: flex-end;
      gap: 6px;
    }
    .image-actions button {
      border-radius: 1px;
      border: 1px solid #222;
      background: #111;
      color: #fff;
      font-size: 12px;
      padding: 4px 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="logo">Nova X — NexOS</div>
    <button class="btn primary" id="newConvBtn">Nouvelle conversation</button>
    <button class="btn" id="importImgBtn">Importer une image</button>
    <button class="btn" id="genImgBtn">Générer une image</button>

    <div class="conversations" id="conversations"></div>

    <input type="file" id="fileInput" accept="image/*" />
  </div>

  <div class="main">
    <div class="header">
      <div class="header-title">Session Nova X</div>
      <div class="header-sub" id="headerSub">Quantum Drive initialisé.</div>
    </div>

    <div class="chat" id="chat"></div>

    <div class="input-bar">
      <input type="text" id="messageInput" placeholder="Écris à Nova X..." />
      <div class="icon-btn" id="fileBtn">📁</div>
      <div class="icon-btn primary" id="sendBtn">➤</div>
    </div>
  </div>

  <script>
    // ⚙️ CONFIG — remplace par l’URL de ton backend Vercel/Netlify
    const API_BASE = "https://TON-BACKEND.vercel.app"; // <- à adapter
    const CHAT_ENDPOINT = API_BASE + "/api/nova-x";

    const chatEl = document.getElementById("chat");
    const msgInput = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const fileBtn = document.getElementById("fileBtn");
    const fileInput = document.getElementById("fileInput");
    const importImgBtn = document.getElementById("importImgBtn");
    const genImgBtn = document.getElementById("genImgBtn");
    const convListEl = document.getElementById("conversations");
    const headerSub = document.getElementById("headerSub");
    const newConvBtn = document.getElementById("newConvBtn");

    let conversations = [];
    let currentConvId = null;

    function createConversation() {
      const id = Date.now().toString();
      conversations.push({ id, title: "Session " + conversations.length, messages: [] });
      currentConvId = id;
      renderConversations();
      renderChat();
    }

    function renderConversations() {
      convListEl.innerHTML = "";
      conversations.forEach(conv => {
        const div = document.createElement("div");
        div.className = "conv-item" + (conv.id === currentConvId ? " active" : "");
        div.textContent = conv.title;
        div.onclick = () => {
          currentConvId = conv.id;
          renderConversations();
          renderChat();
        };
        convListEl.appendChild(div);
      });
    }

    function getCurrentConv() {
      return conversations.find(c => c.id === currentConvId);
    }

    function addMessage(role, content, extra = {}) {
      const conv = getCurrentConv();
      if (!conv) return;
      conv.messages.push({ role, content, ...extra });
      renderChat();
    }

    function renderChat() {
      const conv = getCurrentConv();
      chatEl.innerHTML = "";
      if (!conv) return;

      conv.messages.forEach(msg => {
        const row = document.createElement("div");
        row.className = "msg-row " + (msg.role === "user" ? "user" : "nova");

        const bubble = document.createElement("div");
        bubble.className = "msg " + (msg.role === "user" ? "user" : "nova");
        bubble.textContent = msg.content;

        row.appendChild(bubble);
        chatEl.appendChild(row);

        if (msg.imageUrl) {
          const imgWrap = document.createElement("div");
          imgWrap.className = "image-bubble";

          const img = document.createElement("img");
          img.src = msg.imageUrl;
          imgWrap.appendChild(img);

          const actions = document.createElement("div");
          actions.className = "image-actions";
          const dlBtn = document.createElement("button");
          dlBtn.textContent = "Télécharger";
          dlBtn.onclick = () => {
            const a = document.createElement("a");
            a.href = msg.imageUrl;
            a.download = "nova-x-image.png";
            a.click();
          };
          actions.appendChild(dlBtn);
          imgWrap.appendChild(actions);

          chatEl.appendChild(imgWrap);
        }
      });

      chatEl.scrollTop = chatEl.scrollHeight;
    }

    async function sendMessage(text) {
      if (!text.trim()) return;
      addMessage("user", text);
      msgInput.value = "";
      headerSub.textContent = "Nova X réfléchit...";

      try {
        const conv = getCurrentConv();
        const res = await fetch(CHAT_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            type: "text",
            message: text,
            history: conv.messages
          })
        });
        const data = await res.json();
        addMessage("nova", data.reply || "(Pas de réponse)");
        headerSub.textContent = "Quantum Drive opérationnel.";
      } catch (e) {
        addMessage("nova", "Erreur de connexion au moteur. Vérifie le backend.");
        headerSub.textContent = "Erreur de connexion.";
      }
    }

    async function sendImage(file) {
      if (!file) return;
      addMessage("user", "Image envoyée : " + file.name);

      const formData = new FormData();
      formData.append("file", file);

      headerSub.textContent = "Nova X analyse l’image...";

      try {
        const conv = getCurrentConv();
        const res = await fetch(CHAT_ENDPOINT + "?type=image", {
          method: "POST",
          body: formData
        });
        const data = await res.json();
        addMessage("nova", data.reply || "(Pas de réponse)");
        if (data.generatedImageUrl) {
          addMessage("nova", "Image générée :", { imageUrl: data.generatedImageUrl });
        }
        headerSub.textContent = "Quantum Drive opérationnel.";
      } catch (e) {
        addMessage("nova", "Erreur lors de l’analyse de l’image.");
        headerSub.textContent = "Erreur de connexion.";
      }
    }

    sendBtn.onclick = () => sendMessage(msgInput.value);
    msgInput.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage(msgInput.value);
      }
    });

    fileBtn.onclick = () => fileInput.click();
    importImgBtn.onclick = () => fileInput.click();
    fileInput.onchange = () => {
      const file = fileInput.files[0];
      if (file) sendImage(file);
    };

    genImgBtn.onclick = () => {
      const prompt = prompt("Décris l’image que Nova X doit générer :");
      if (!prompt) return;
      addMessage("user", "Génère une image : " + prompt);
      // À implémenter côté backend : type "generate-image"
      fetch(CHAT_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ type: "generate-image", prompt })
      })
        .then(r => r.json())
        .then(data => {
          addMessage("nova", data.reply || "Image générée.");
          if (data.generatedImageUrl) {
            addMessage("nova", "Image générée :", { imageUrl: data.generatedImageUrl });
          }
        })
        .catch(() => addMessage("nova", "Erreur lors de la génération d’image."));
    };

    newConvBtn.onclick = () => {
      createConversation();
    };

    // Init
    createConversation();
  </script>
</body>
</html>
